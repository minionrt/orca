name: Monthly Auto Release

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if develop has new commits
        id: check
        run: |
          git fetch origin develop
          git fetch origin main
          commits_ahead=$(git rev-list origin/main..origin/develop --count)
          echo "commits_ahead=$commits_ahead" >> $GITHUB_OUTPUT

      - name: Create PR develop → main
        if: steps.check.outputs.commits_ahead != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore(release): monthly merge develop into main"
          body: "Automated monthly release PR. Includes all commits from develop → main."
          branch: auto/release-${{ github.run_id }}
          base: main
          commit-message: "chore(release): monthly merge develop into main"
