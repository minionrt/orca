[package]
name = "orca"
version = "0.4.0"
edition = "2024"

[lib]
name = "orca"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = "2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.0", features = ["rt-multi-thread", "process"] }
tempfile = "3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
regex = "1.11.1"
bollard = "0.19.1"
tar = "0.4"
futures-util = "0.3"
hyper = "1.6"
pin-project-lite = "0.2"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
nom = "8.0.0"
gix-packetline = "0.19.0"
bytes = "1.10.1"
futures = "0.3.31"
flate2 = "1.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
