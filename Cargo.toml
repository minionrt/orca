[package]
name = "teamprojekt-agents"
version = "0.1.0"
edition = "2024"

[lib]
name = "teamprojekt_agents"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = "2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.0", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"


